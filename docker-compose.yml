services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    container_name: mongodb
    # No ports: MongoDB is only reachable from the flask service on the internal network
    volumes:
      - mongo-data:/data/db

  flask-service:
    build:
      context: ./api
    restart: unless-stopped
    container_name: flask
    depends_on:
      - mongodb
    ports:
      - 5000:5000
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}

volumes:
  mongo-data:
