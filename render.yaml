# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the API from api/Dockerfile and the React frontend from web/ as a static site.
# MongoDB is hosted separately (e.g. a free MongoDB Atlas cluster).
services:
  - type: web
    name: digital-airlines-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /flights
    autoDeploy: true
    # Only rebuild the API when its own files change
    buildFilter:
      paths:
        - api/**
    envVars:
      # mongodb+srv://... connection string from MongoDB Atlas, entered in the Render dashboard
      - key: MONGO_URI
        sync: false
      # Keep the live admin password private; only the demo user account is public
      - key: ADMIN_PASSWORD
        sync: false
      # Signs the access tokens
      - key: SECRET_KEY
        generateValue: true
      # Render sits behind Cloudflare, which sets this header to the real client IP; used for rate limits
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # The frontend below, which calls the API from the browser
      - key: CORS_ORIGINS
        value: https://digital-airlines-web.onrender.com

  - type: web
    name: digital-airlines-web
    runtime: static
    autoDeploy: true
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    buildFilter:
      paths:
        - web/**
    # Send every path to the React app, so links like /login work on reload
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://digital-airlines-api.onrender.com
      - key: NODE_VERSION
        value: "24"
