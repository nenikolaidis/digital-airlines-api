name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Wait for the API and log in as the demo user
        run: |
          for i in $(seq 30); do curl -sf http://localhost:5000/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5000/flights
          curl -sf --json '{"email": "nearchos@example.com", "password": "user1234"}' http://localhost:5000/auth/login
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
        if: always()
